# Einstellungen für cargo-about (erzeugt die Lizenztexte der Rust-Bibliotheken).
# Neu erzeugen:  cd desktop/src-tauri && cargo about generate about.hbs -o ../THIRD_PARTY_RUST_LICENSES.txt
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
# keine Abfrage bei externen Diensten (clearlydefined.io)
no-clearly-defined = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Unser eigenes Programm nicht mit auflisten
private = { ignore = true }
