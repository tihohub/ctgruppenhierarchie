[package]
name = "ct-gruppenhierarchie"
version = "0.1.0"
description = "CT Gruppenhierarchie – Desktop-App"
authors = ["Tim Hofmann"]
license-file = "../../LICENSE.txt"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

[profile.release]
# kleineres Programm
codegen-units = 1
lto = true
opt-level = "s"
strip = true
