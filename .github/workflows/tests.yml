# Führt die automatischen Tests bei jedem Pull Request und jeder Änderung auf main aus.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Browser für die Tests installieren
        run: npx playwright install --with-deps chromium
      - name: Tests ausführen
        run: npm test
