# Erstellt ein GitHub Release: Tests ausführen, Download-Pakete bauen, Release mit Tag anlegen.
# Start entweder per Knopf (Actions → Release → „Run workflow“, Versionsnummer eingeben)
# oder durch Setzen eines Tags (z. B. v20).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. v20"
        required: true
  push:
    tags: ["v*"]

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  python-paket:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Version bauen
        run: python3 tools/build_python.py "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-paket
          path: dist/*.zip

  release:
    needs: python-paket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "CT Gruppenhierarchie ${VERSION}" \
            --notes-file .github/release-notes.md \
            --generate-notes

  # Webseite auf GitHub Pages aktualisieren. Voraussetzung (einmalig in den Repo-Einstellungen):
  # Repo öffentlich und Settings → Pages → Source: „GitHub Actions“.
  webseite:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webseite bauen
        run: python3 tools/build_web.py "${VERSION}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/webseite
      - id: deploy
        uses: actions/deploy-pages@v4
